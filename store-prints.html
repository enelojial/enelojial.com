---
layout: default
permalink: /store/prints
---

<body>
  <div class="row">
    {% for post in site.tags.prints reversed %}
      {% if post.available_url %}
        <div class="store-item">
          <a href="{{ post.available_url }}" target="_blank">
            <div class="col" style="background-image: url(
              {% if post.image_thumb_url %}
                {{ post.image_thumb_url | prepend: site.baseurl }}
              {% else %}
                {{ post.image_url | prepend: site.baseurl }}
              {% endif %}
                ); background-size: cover">
            </div>
          </a>
          <div class="store-item-meta">
            <div class="store-item-title">{{ post.title }}</div>
            {% if post.price %}
              <div class="store-item-price">{{ post.price }}</div>
            {% endif %}
          </div>
        </div>
      {% endif %}
    {% endfor %}
  </div>
</body>
